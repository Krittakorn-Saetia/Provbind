# Settings for the live demo (scripts/live-demo.sh, docs/LIVE-DEMO.md). Edit and save; the next
# `make live-demo` uses them. Any of them can also be set for one run on the command line, which wins:
#     make live-demo ATTACK=overwrite PAUSE=enter
# The defaults run hands-free in about a minute. `make live-demo-settings` shows what is in use.

# The acts, in order. Any of:
#   envelope  PROVBIND compiles the app's runtime envelope from its signed evidence (about 5 s)
#   shell     an operator opens a shell: PROVBIND logs it, does not alert; Falco alerts (about 10 s)
#   attack    the attack chosen by ATTACK below (about 10 s)
#   trust     the trust change chosen by TRUST below, while the app runs (about 5 s)
#   log       the alert log verifies; one character changes; verification fails (about 3 s)
#   unsigned  an unsigned copy of the app fails verification (about 40 s; the first time also
#             about a minute to build that copy)
ACTS="envelope shell attack trust log"

# Between two acts: a number of seconds (hands-free), or "enter" to wait for the presenter.
PAUSE=3

# The captions on the presenter's screen: short (one line per act) or long (what to say and watch).
CAPTIONS=short

# The attack in the "attack" act:
#   update     the dependency requestz-helper drops a program in /tmp, runs it, and it edits /etc/passwd
#   overwrite  the app overwrites the signed /usr/bin/ls, runs it, then restores it
#   inject     a library written at runtime is preloaded into a new process
#   egress     the app connects to an address outside its egress allow list (nothing is sent)
ATTACK=update

# The trust change in the "trust" act:
#   advisory   an advisory for ADVISORY_PACKAGE appears in the local feed (OSV format)
#   key        the signing key is revoked
TRUST=advisory
# The package must be in the image's SBOM. Ecosystems: PyPI, npm, Debian, Ubuntu, Go, crates.io,
# Maven, RubyGems, NuGet, Packagist, Alpine. An empty version means every version.
ADVISORY_PACKAGE=requestz-helper
ADVISORY_VERSION=0.1.0
ADVISORY_ECOSYSTEM=PyPI
# A MAL- id withdraws trust. Any other id (CVE-...) is only reported: the trust policy keeps trust.
ADVISORY_ID=MAL-2026-9001

# What the operator runs in the "shell" act.
SHELL_CMD="ls /; cat /etc/hostname"

# 1: every run restarts PROVBIND on a fresh run folder, so the alert screen starts empty and nothing
#    needs undoing. 0: keep the running services and folder (then `make live-demo-reset` undoes acts).
FRESH=1

# 1: the "envelope" act redeploys the app, so admission happens live (adds about 20 s).
# 0: PROVBIND compiles the envelope of the app that is already running.
REDEPLOY=0

# Seconds to wait for an act's alert before moving on.
WAIT_S=30

# Earlier run folders kept as run-demo.<date-time>, for a replay (plan B).
KEEP_RUNS=3

# Show Falco's alerts next to PROVBIND's in the shell and attack acts: auto (if Falco runs) or off.
FALCO=auto

# Sensor policies: opt, the rate-limited set the evaluation measured; orig, the unfiltered set.
# With opt the sensor reports an identical write or library load once a minute, so the script
# waits out that minute before repeating ATTACK=overwrite or ATTACK=inject.
POLICY_SET=opt

# The signed image, as ref@digest. Empty: use the running deployment's image, else
# <registry>/demo-app:latest from the local registry.
DEMO_REF=

NAMESPACE=demo
DEPLOY=demo-app
