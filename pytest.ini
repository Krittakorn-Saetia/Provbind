[pytest]
# `pytest -q` runs the unit tests only; `pytest -q -m integration` runs the ones that
# need Docker, the local registry and PROVBIND_STANDIN_REF (the later -m wins).
addopts = -m "not integration"
testpaths = compiler/tests pipeline/tests tests
pythonpath = .
markers =
    integration: needs Docker, the cluster, Tetragon or the local registry (demo PC only)
